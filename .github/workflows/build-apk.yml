name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDKMGR=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true

      - name: Install JS deps
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" alqanot.apk
          ls -lh alqanot.apk
          gh release create app-apk --title "AL QANOT APK" --notes "avtomatik build" 2>/dev/null || true
          gh release upload app-apk alqanot.apk --clobber
