name: build-ipa

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS deps
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --no-install

      - name: Pod install
        run: |
          cd ios
          pod install

      - name: Build unsigned (.app)
        run: |
          cd ios
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE="" \
            build

      - name: Package unsigned .ipa
        run: |
          cd ios
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          mkdir -p output
          zip -r -y output/AlQanot.ipa Payload >/dev/null
          ls -lh output

      - name: Publish IPA to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA=$(ls ios/output/*.ipa | head -1)
          cp "$IPA" alqanot.ipa
          ls -lh alqanot.ipa
          gh release create app-ipa --title "AL QANOT IPA" --notes "avtomatik build" 2>/dev/null || true
          gh release upload app-ipa alqanot.ipa --clobber
